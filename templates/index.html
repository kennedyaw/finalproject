<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Near-Earth Asteroid Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Near-Earth Asteroid Tracker</h1>
      <p id="week-label" class="subtle">Loading this week…</p>
    </div>
    <label class="toggle">
      <input type="checkbox" id="hazard-toggle">
      <span class="track" aria-hidden="true"></span>
      <span>Hazardous only</span>
    </label>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <!-- Screen 1: weekly dashboard -->
    <section id="list-view">
      <div class="list-head">
        <p id="count" class="subtle"></p>
        <p class="legend"><span class="swatch"></span> Potentially hazardous</p>
      </div>
      <div id="cards" class="cards" aria-live="polite"></div>
      <section class="chart-block">
        <h2>Biggest rocks this week vs. landmarks</h2>
        <div id="overview-chart" class="chart"></div>
      </section>
    </section>

    <!-- Screen 2: detail and visual view -->
    <section id="detail-view" hidden>
      <a href="#" class="back">← Back to this week</a>
      <div class="detail-grid">
        <div class="stats-panel">
          <h2 id="detail-name"></h2>
          <p id="detail-badge"></p>
          <dl id="detail-stats" class="stats"></dl>
          <p id="detail-link"></p>
        </div>
        <div class="chart-panel">
          <h3>How big is it?</h3>
          <div id="detail-chart" class="chart"></div>
          <p class="subtle small">Bars show the midpoint of NASA's size estimate; the line shows the full range. Landmarks are heights.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="subtle small">
    Data: NASA NeoWs (api.nasa.gov). <span id="updated"></span>
  </footer>
</body>
</html>
